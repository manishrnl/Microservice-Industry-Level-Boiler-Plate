server:
  port: ${SERVER_PORT:${PORT:8888}}
spring:
  application:
    name: config-server
  output:
    ansi:
      enabled: ${SPRING_OUTPUT_ANSI_ENABLED:ALWAYS}
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:file:../../.env[.properties]"
  profiles:
    active: ${CONFIG_SERVER_BACKEND}
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_NATIVE_SEARCH_LOCATIONS}
        git:
          uri: ${CONFIG_GIT_URI}
          default-label: ${CONFIG_GIT_LABEL}
          search-paths: ${CONFIG_GIT_SEARCH_PATHS}
          username: ${CONFIG_GIT_USERNAME}
          password: ${CONFIG_GIT_TOKEN}
        encrypt:
          enabled: true
encrypt:
  key: ${CONFIG_ENCRYPT_KEY}
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus
logging:
  pattern:
    level: "%5p traceId=%X{traceId:-} spanId=%X{spanId:-} userId=%X{userId:-}"
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(${logging.pattern.level}) %clr([%15.15t]){faint} %clr(%-38.38logger{37}){cyan} %clr(:){faint} %m%n%wEx"
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    register-with-eureka: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_CLIENT_FETCH_REGISTRY:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka_password}@localhost:8761/eureka}
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    instance-id: ${spring.application.name}:${server.port}

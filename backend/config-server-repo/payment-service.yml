server:
  port: ${SERVER_PORT:${PORT:8084}}
spring:
  datasource:
    url: ${PAYMENT_DATABASE_URL}
    username: ${PAYMENT_DATABASE_USERNAME}
    password: ${PAYMENT_DATABASE_PASSWORD}
payment:
  default-currency: ${STRIPE_CURRENCY:usd}
  frontend-base-url: ${FRONTEND_PUBLIC_URL:https://manishrnl-microservice-template.netlify.app}
  stripe:
    secret-key: ${STRIPE_API_KEY:${STRIPE_SECRET_KEY:}}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
stripe:
  api:
    key: ${STRIPE_API_KEY:${STRIPE_SECRET_KEY:}}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:}

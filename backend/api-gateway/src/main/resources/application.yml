server:
  port: ${SERVER_PORT:${PORT:8080}}

spring:
  application:
    name: api-gateway
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:file:../../.env[.properties]"
      - "optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}"
  cloud:
    config:
      fail-fast: false
      request-connect-timeout: 2000
      request-read-timeout: 2000
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              # Vite picks 5174 if 5173 is busy; localhost vs 127.0.0.1 differ by browser origin string
              - ${FRONTEND_PUBLIC_URL:https://manishrnl-microservice-template.netlify.app}
              - https://manishrnl-microservice-template.netlify.app
              - http://localhost:5174
              - http://127.0.0.1:5173
              - http://127.0.0.1:5174
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            allow-credentials: true
      discovery:
        locator:
          enabled: ${GATEWAY_DISCOVERY_LOCATOR_ENABLED:false}
      httpclient:
        connect-timeout: ${GATEWAY_HTTP_CONNECT_TIMEOUT_MS:3000}
        response-timeout: ${GATEWAY_HTTP_RESPONSE_TIMEOUT:30s}
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:${AUTH_SERVICE_URL:http://auth-service:8081}}
          predicates: [Path=/api/v1/auth/**]
        - id: user-service
          uri: ${USER_SERVICE_URI:${USER_SERVICE_URL:http://user-service:8082}}
          predicates: [Path=/api/v1/users/**]
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:${NOTIFICATION_SERVICE_URL:http://notification-service:8083}}
          predicates: [Path=/api/v1/notifications/**]
        - id: ai-service
          uri: ${AI_SERVICE_URI:${AI_SERVICE_URL:http://ai-service:8086}}
          predicates: [Path=/api/v1/ai/**]
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URI:${PAYMENT_SERVICE_URL:http://payment-service:8084}}
          predicates: [Path=/api/v1/payments/**]
        - id: file-service
          uri: ${FILE_SERVICE_URI:${FILE_SERVICE_URL:http://file-service:8085}}
          predicates: [Path=/api/v1/files/**]
        - id: audit-service
          uri: ${AUDIT_SERVICE_URI:${AUDIT_SERVICE_URL:http://audit-service:8087}}
          predicates: [Path=/api/v1/audit/**]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    register-with-eureka: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_CLIENT_FETCH_REGISTRY:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
    discovery:
      enabled: ${MANAGEMENT_HEALTH_DISCOVERY_ENABLED:false}

gateway:
  jwt:
    jwks-url: ${AUTH_JWKS_URL:http://auth-service:8081/api/v1/auth/.well-known/jwks.json}
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    include-probe-paths: ${GATEWAY_RATE_LIMIT_INCLUDE_PROBE_PATHS:false}
    fail-open: ${GATEWAY_RATE_LIMIT_FAIL_OPEN:true}
    anonymous-requests-per-minute: ${GATEWAY_RATE_LIMIT_ANON_PER_MINUTE:100}
    authenticated-requests-per-minute: ${GATEWAY_RATE_LIMIT_AUTH_PER_MINUTE:1000}
  request-logging:
    enabled: ${GATEWAY_REQUEST_LOGGING_ENABLED:false}
    slow-threshold-ms: ${GATEWAY_SLOW_REQUEST_LOG_MS:1000}

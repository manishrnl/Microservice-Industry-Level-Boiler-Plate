services:
  config-server:
    env_file:
      - .env
    image: microservice-industry-config-server:0.1.0
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile-config-server
    environment:
      CONFIG_SERVER_BACKEND: ${CONFIG_SERVER_BACKEND}
      CONFIG_GIT_URI: ${CONFIG_GIT_URI}
      CONFIG_GIT_LABEL: ${CONFIG_GIT_LABEL}
      CONFIG_GIT_SEARCH_PATHS: ${CONFIG_GIT_SEARCH_PATHS}
      CONFIG_GIT_USERNAME: ${CONFIG_GIT_USERNAME}
      CONFIG_GIT_TOKEN: ${CONFIG_GIT_TOKEN}
      CONFIG_NATIVE_SEARCH_LOCATIONS: ${CONFIG_NATIVE_SEARCH_LOCATIONS}
      CONFIG_ENCRYPT_KEY: ${CONFIG_ENCRYPT_KEY}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED:-true}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:-true}
      EUREKA_CLIENT_FETCH_REGISTRY: ${EUREKA_CLIENT_FETCH_REGISTRY:-true}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:-true}
      EUREKA_SERVER_PEER_NODE_READ_TIMEOUT_MS: 30000
    ports:
      - "${CONFIG_SERVER_HOST_PORT:-8888}:8888"
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [backend-net]

  discovery-server:
    env_file:
      - .env
    image: microservice-industry-discovery-server:0.1.0
    pull_policy: never
    build:
      context: .
      args:
        MODULE: discovery-server
    environment:
      EUREKA_USER: ${EUREKA_USER}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_HOSTNAME: ${EUREKA_HOSTNAME}
      EUREKA_PEERS: ${EUREKA_PEERS}
      EUREKA_REGISTER_SELF: ${EUREKA_REGISTER_SELF}
      EUREKA_FETCH_REGISTRY: ${EUREKA_FETCH_REGISTRY}
      EUREKA_SERVER_PEER_NODE_READ_TIMEOUT_MS: 30000
      EUREKA_SERVER_PEER_NODE_CONNECT_TIMEOUT_MS: 10000
      EUREKA_SERVER_RESPONSE_CACHE_UPDATE_INTERVAL_MS: 30000
    ports:
      - "${DISCOVERY_SERVER_HOST_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://${EUREKA_USER}:${EUREKA_PASSWORD}@localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [backend-net]

  api-gateway:
    env_file:
      - .env
    image: microservice-industry-api-gateway:0.1.0
    pull_policy: never
    build:
      context: .
      args:
        MODULE: api-gateway
    environment:
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED:-true}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:-true}
      EUREKA_CLIENT_FETCH_REGISTRY: ${EUREKA_CLIENT_FETCH_REGISTRY:-true}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:-true}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED}
    ports:
      - "${API_GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      notification-service:
        condition: service_started
      payment-service:
        condition: service_started
      file-service:
        condition: service_started
      ai-service:
        condition: service_started
      audit-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [backend-net, frontend-net]

  auth-service:
    env_file:
      - .env
    image: microservice-industry-auth-service:0.1.0
    pull_policy: never
    build:
      context: .
      args:
        MODULE: auth-service
    environment:
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL}
      AUTH_DATABASE_USERNAME: ${AUTH_DATABASE_USERNAME}
      AUTH_DATABASE_PASSWORD: ${AUTH_DATABASE_PASSWORD}
      DATABASE_AUTO_DDL: ${DATABASE_AUTO_DDL:-create}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED:-true}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:-true}
      EUREKA_CLIENT_FETCH_REGISTRY: ${EUREKA_CLIENT_FETCH_REGISTRY:-true}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:-true}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED}
      JWT_KEY_ID: ${JWT_KEY_ID}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8082}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8083}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://payment-service:8084}
      FILE_SERVICE_URL: ${FILE_SERVICE_URL:-http://file-service:8085}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8086}
      AUDIT_SERVICE_URL: ${AUDIT_SERVICE_URL:-http://audit-service:8087}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_AUTHORIZATION_URI: ${GOOGLE_AUTHORIZATION_URI}
      GOOGLE_OAUTH_SCOPES: ${GOOGLE_OAUTH_SCOPES}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET}
      GITHUB_AUTHORIZATION_URI: ${GITHUB_AUTHORIZATION_URI}
      GITHUB_OAUTH_SCOPES: ${GITHUB_OAUTH_SCOPES}
      LINKEDIN_OAUTH_CLIENT_ID: ${LINKEDIN_OAUTH_CLIENT_ID}
      LINKEDIN_OAUTH_CLIENT_SECRET: ${LINKEDIN_OAUTH_CLIENT_SECRET}
      LINKEDIN_ISSUER_URI: ${LINKEDIN_ISSUER_URI}
      LINKEDIN_AUTHORIZATION_URI: ${LINKEDIN_AUTHORIZATION_URI}
      LINKEDIN_TOKEN_URI: ${LINKEDIN_TOKEN_URI}
      LINKEDIN_USER_INFO_URI: ${LINKEDIN_USER_INFO_URI}
      LINKEDIN_OAUTH_SCOPES: ${LINKEDIN_OAUTH_SCOPES}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
    ports:
      - "${AUTH_SERVICE_HOST_PORT:-8081}:8081"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 45
    restart: unless-stopped
    networks: [backend-net]

  user-service:
    env_file:
      - .env
    image: microservice-industry-user-service:0.1.0
    pull_policy: never
    build:
      context: .
      args:
        MODULE: user-service
    environment:
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      DATABASE_AUTO_DDL: ${DATABASE_AUTO_DDL:-create}
      USER_DATABASE_URL: ${USER_DATABASE_URL}
      USER_DATABASE_USERNAME: ${USER_DATABASE_USERNAME}
      USER_DATABASE_PASSWORD: ${USER_DATABASE_PASSWORD}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED:-true}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:-true}
      EUREKA_CLIENT_FETCH_REGISTRY: ${EUREKA_CLIENT_FETCH_REGISTRY:-true}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:-true}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    ports:
      - "${USER_SERVICE_HOST_PORT:-8082}:8082"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [backend-net]

  notification-service:
    env_file:
      - .env
    image: microservice-industry-notification-service:0.1.0
    pull_policy: never
    build:
      context: .
      args:
        MODULE: notification-service
    environment:
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      DATABASE_AUTO_DDL: ${DATABASE_AUTO_DDL:-create}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED:-true}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:-true}
      EUREKA_CLIENT_FETCH_REGISTRY: ${EUREKA_CLIENT_FETCH_REGISTRY:-true}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:-true}
      NOTIFICATION_DATABASE_URL: ${NOTIFICATION_DATABASE_URL}
      NOTIFICATION_DATABASE_USERNAME: ${NOTIFICATION_DATABASE_USERNAME}
      NOTIFICATION_DATABASE_PASSWORD: ${NOTIFICATION_DATABASE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
    ports:
      - "${NOTIFICATION_SERVICE_HOST_PORT:-8083}:8083"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [backend-net]

  payment-service:
    env_file:
      - .env
    image: microservice-industry-payment-service:0.1.0
    pull_policy: never
    build:
      context: .
      args:
        MODULE: payment-service
    environment:
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      DATABASE_AUTO_DDL: ${DATABASE_AUTO_DDL:-create}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED:-true}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:-true}
      EUREKA_CLIENT_FETCH_REGISTRY: ${EUREKA_CLIENT_FETCH_REGISTRY:-true}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:-true}
      PAYMENT_DATABASE_URL: ${PAYMENT_DATABASE_URL}
      PAYMENT_DATABASE_USERNAME: ${PAYMENT_DATABASE_USERNAME}
      PAYMENT_DATABASE_PASSWORD: ${PAYMENT_DATABASE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY}
    ports:
      - "${PAYMENT_SERVICE_HOST_PORT:-8084}:8084"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [backend-net]

  file-service:
    env_file:
      - .env
    image: microservice-industry-file-service:0.1.0
    pull_policy: never
    build:
      context: .
      args:
        MODULE: file-service
    environment:
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      DATABASE_AUTO_DDL: ${DATABASE_AUTO_DDL:-create}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED:-true}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:-true}
      EUREKA_CLIENT_FETCH_REGISTRY: ${EUREKA_CLIENT_FETCH_REGISTRY:-true}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:-true}
      FILE_DATABASE_URL: ${FILE_DATABASE_URL}
      FILE_DATABASE_USERNAME: ${FILE_DATABASE_USERNAME}
      FILE_DATABASE_PASSWORD: ${FILE_DATABASE_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      FILE_PUBLIC_BASE_URL: ${FILE_PUBLIC_BASE_URL}
      FILE_DOWNLOAD_BASE_URL: ${FILE_DOWNLOAD_BASE_URL}
    ports:
      - "${FILE_SERVICE_HOST_PORT:-8085}:8085"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [backend-net]

  ai-service:
    env_file:
      - .env
    image: microservice-industry-ai-service:0.1.0
    pull_policy: never
    build:
      context: .
      args:
        MODULE: ai-service
    environment:
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      DATABASE_AUTO_DDL: ${DATABASE_AUTO_DDL:-create}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED:-true}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:-true}
      EUREKA_CLIENT_FETCH_REGISTRY: ${EUREKA_CLIENT_FETCH_REGISTRY:-true}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:-true}
      AI_DATABASE_URL: ${AI_DATABASE_URL}
      AI_DATABASE_USERNAME: ${AI_DATABASE_USERNAME}
      AI_DATABASE_PASSWORD: ${AI_DATABASE_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_BASE_URL: ${GROQ_BASE_URL}
      GROQ_MODEL: ${GROQ_MODEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE}
      AI_CONTEXT_MAX_MESSAGES: ${AI_CONTEXT_MAX_MESSAGES}
      AI_CONTEXT_CACHE_TTL_HOURS: ${AI_CONTEXT_CACHE_TTL_HOURS}
    ports:
      - "${AI_SERVICE_HOST_PORT:-8086}:8086"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [backend-net]

  audit-service:
    env_file:
      - .env
    image: microservice-industry-audit-service:0.1.0
    pull_policy: never
    build:
      context: .
      args:
        MODULE: audit-service
    environment:
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      DATABASE_AUTO_DDL: ${DATABASE_AUTO_DDL:-create}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED:-true}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:-true}
      EUREKA_CLIENT_FETCH_REGISTRY: ${EUREKA_CLIENT_FETCH_REGISTRY:-true}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:-true}
      AUDIT_DATABASE_URL: ${AUDIT_DATABASE_URL}
      AUDIT_DATABASE_USERNAME: ${AUDIT_DATABASE_USERNAME}
      AUDIT_DATABASE_PASSWORD: ${AUDIT_DATABASE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS}
    ports:
      - "${AUDIT_SERVICE_HOST_PORT:-8087}:8087"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8087/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [backend-net]

  frontend:
    env_file:
      - .env
    image: node:24.15.0-alpine
    pull_policy: never
    working_dir: /app
    command: sh -c "test -d node_modules/.bin || npm install --prefer-offline --no-audit && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_OAUTH_PROVIDERS: ${VITE_OAUTH_PROVIDERS}
      VITE_DEV_PROXY_TARGET: ${VITE_DEV_PROXY_TARGET:-http://api-gateway:8080}
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      api-gateway:
        condition: service_started
    restart: unless-stopped
    networks: [frontend-net]

  postgres:
    image: postgres:16.4-alpine
    pull_policy: missing
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend-net]

  redis:
    image: redis:7.4.2-alpine
    pull_policy: missing
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend-net]

  kafka:
    image: apache/kafka:3.7.0
    pull_policy: missing
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [backend-net]

  kafka-topics:
    image: apache/kafka:3.7.0
    pull_policy: missing
    command: >
      sh -c "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic auth.events --partitions 3 --replication-factor 1 &&
             /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic user.events --partitions 3 --replication-factor 1 &&
             /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.events --partitions 3 --replication-factor 1 &&
             /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic notification.events --partitions 3 --replication-factor 1 &&
             /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic audit.events --partitions 3 --replication-factor 1 &&
             /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic notification.events.DLT --partitions 3 --replication-factor 1"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [backend-net]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: missing
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [backend-net]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    pull_policy: missing
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [backend-net]

  zipkin:
    image: openzipkin/zipkin:2.27.0
    pull_policy: missing
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9411/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [backend-net]

  zipkin-proxy:
    image: httpd:2.4-alpine
    env_file:
      - .env
    volumes:
      - ./backend/infrastructure/observability/zipkin-proxy.conf:/usr/local/apache2/conf/extra/observability.conf:ro
    command: >
      sh -c "sed -i 's/^#LoadModule proxy_module/LoadModule proxy_module/' /usr/local/apache2/conf/httpd.conf &&
             sed -i 's/^#LoadModule proxy_http_module/LoadModule proxy_http_module/' /usr/local/apache2/conf/httpd.conf &&
             echo 'Include conf/extra/observability.conf' >> /usr/local/apache2/conf/httpd.conf &&
             htpasswd -Bbc /usr/local/apache2/conf/.htpasswd \"$${OBSERVABILITY_USERNAME}\" \"$${OBSERVABILITY_PASSWORD}\" &&
             httpd-foreground"
    ports:
      - "9411:80"
    depends_on:
      zipkin:
        condition: service_healthy
    networks: [backend-net]

  prometheus:
    image: prom/prometheus:v3.11.3
    pull_policy: missing
    volumes:
      - ./backend/infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [backend-net]

  prometheus-proxy:
    image: httpd:2.4-alpine
    env_file:
      - .env
    volumes:
      - ./backend/infrastructure/observability/prometheus-proxy.conf:/usr/local/apache2/conf/extra/observability.conf:ro
    command: >
      sh -c "sed -i 's/^#LoadModule proxy_module/LoadModule proxy_module/' /usr/local/apache2/conf/httpd.conf &&
             sed -i 's/^#LoadModule proxy_http_module/LoadModule proxy_http_module/' /usr/local/apache2/conf/httpd.conf &&
             echo 'Include conf/extra/observability.conf' >> /usr/local/apache2/conf/httpd.conf &&
             htpasswd -Bbc /usr/local/apache2/conf/.htpasswd \"$${OBSERVABILITY_USERNAME}\" \"$${OBSERVABILITY_PASSWORD}\" &&
             httpd-foreground"
    ports:
      - "9090:80"
    depends_on:
      - prometheus
    networks: [backend-net]

  loki:
    image: grafana/loki:3.5.1
    pull_policy: missing
    command: -config.file=/etc/loki/local-config.yml
    volumes:
      - ./backend/infrastructure/loki/loki-config.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks: [backend-net]

  promtail:
    image: grafana/promtail:3.5.1
    pull_policy: missing
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./backend/infrastructure/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp/promtail
    depends_on:
      - loki
    restart: unless-stopped
    networks: [backend-net]

  grafana:
    image: grafana/grafana:13.0.1
    pull_policy: missing
    environment:
      GF_SECURITY_ADMIN_USER: ${OBSERVABILITY_USERNAME}
      GF_SECURITY_ADMIN_PASSWORD: ${OBSERVABILITY_PASSWORD}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      ZIPKIN_URL: ${ZIPKIN_URL:-http://zipkin:9411}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./backend/infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./backend/infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - zipkin
      - loki
    networks: [backend-net]

networks:
  backend-net:
    internal: false
  frontend-net:
    internal: false

volumes:
  postgres-data:
  redis-data:
  minio-data:
  grafana-data:
  loki-data:
  promtail-positions:
  frontend-node-modules:

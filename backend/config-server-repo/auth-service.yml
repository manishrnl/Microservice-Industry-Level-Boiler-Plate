server:
  port: ${SERVER_PORT:${PORT:8081}}
  tomcat:
    threads:
      max: ${AUTH_TOMCAT_MAX_THREADS:300}
      min-spare: ${AUTH_TOMCAT_MIN_SPARE_THREADS:30}
    accept-count: ${AUTH_TOMCAT_ACCEPT_COUNT:1000}
    max-connections: ${AUTH_TOMCAT_MAX_CONNECTIONS:10000}
spring:
  datasource:
    driver-class-name: ${HIBERNATE_DRIVER_NAME:org.postgresql.Driver}
    url: ${AUTH_DATABASE_URL}
    username: ${AUTH_DATABASE_USERNAME}
    password: ${AUTH_DATABASE_PASSWORD}
    hikari:
      pool-name: auth-service-hikari
      maximum-pool-size: ${AUTH_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:5}}
      minimum-idle: ${AUTH_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:0}}
      connection-timeout: ${AUTH_DB_CONNECTION_TIMEOUT_MS:${DB_CONNECTION_TIMEOUT_MS:10000}}
      validation-timeout: ${AUTH_DB_VALIDATION_TIMEOUT_MS:${DB_VALIDATION_TIMEOUT_MS:5000}}
      idle-timeout: ${AUTH_DB_IDLE_TIMEOUT_MS:${DB_IDLE_TIMEOUT_MS:60000}}
      max-lifetime: ${AUTH_DB_MAX_LIFETIME_MS:${DB_MAX_LIFETIME_MS:180000}}
      keepalive-time: ${AUTH_DB_KEEPALIVE_TIME_MS:${DB_KEEPALIVE_TIME_MS:60000}}
      connection-test-query: SELECT 1
      leak-detection-threshold: ${AUTH_DB_LEAK_DETECTION_MS:0}
  jpa:
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  mail:
    host: ${MAIL_HOST:mailhog}
    port: ${MAIL_PORT:1025}
    username: ${BREVO_USERNAME:}
    password: ${BREVO_PASSWORD:}
    properties:
      mail:
        debug: ${MAIL_DEBUG:false}
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          fromEmail: ${BREVO_FROM_EMAIL:${MAIL_FROM:no-reply@platform.local}}
management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
security:
  jwt:
    key-id: ${JWT_KEY_ID}
    issuer: ${JWT_ISSUER}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS}
  cookies:
    secure: ${SECURITY_COOKIES_SECURE:false}
    same-site: ${SECURITY_COOKIES_SAME_SITE:Lax}
oauth:
  redirect-base-url: ${BACKEND_PUBLIC_URL}
  frontend-redirect-url: ${FRONTEND_PUBLIC_URL}
  providers:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
      authorization-uri: ${GOOGLE_AUTHORIZATION_URI}
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
      scopes: ${GOOGLE_OAUTH_SCOPES}
    github:
      client-id: ${GITHUB_OAUTH_CLIENT_ID}
      client-secret: ${GITHUB_OAUTH_CLIENT_SECRET}
      authorization-uri: ${GITHUB_AUTHORIZATION_URI}
      token-uri: https://github.com/login/oauth/access_token
      user-info-uri: https://api.github.com/user
      scopes: ${GITHUB_OAUTH_SCOPES}
    linkedin:
      client-id: ${LINKEDIN_OAUTH_CLIENT_ID}
      client-secret: ${LINKEDIN_OAUTH_CLIENT_SECRET}
      authorization-uri: ${LINKEDIN_AUTHORIZATION_URI}
      token-uri: ${LINKEDIN_TOKEN_URI}
      user-info-uri: ${LINKEDIN_USER_INFO_URI}
      scopes: ${LINKEDIN_OAUTH_SCOPES}
app:
  frontend-base-url: ${FRONTEND_PUBLIC_URL}
  user-service-url: ${USER_SERVICE_URL:http://user-service:8082}
  notification-service-url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8083}
  payment-service-url: ${PAYMENT_SERVICE_URL:http://payment-service:8084}
  file-service-url: ${FILE_SERVICE_URL:http://file-service:8085}
  ai-service-url: ${AI_SERVICE_URL:http://ai-service:8086}
  audit-service-url: ${AUDIT_SERVICE_URL:http://audit-service:8087}
  bootstrap-super-admin-email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:manishrajrnl@zohomail.in}
  bootstrap-super-admin-username: ${BOOTSTRAP_SUPER_ADMIN_USERNAME:manish}
  bootstrap-super-admin-password: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:Password@123}
  mail:
    provider: ${MAIL_PROVIDER:smtp}
    from: ${BREVO_FROM_EMAIL:${MAIL_FROM:no-reply@platform.local}}
    from-name: ${MAIL_FROM_NAME:Platform}
    brevo:
      api-key: ${BREVO_API_KEY:}

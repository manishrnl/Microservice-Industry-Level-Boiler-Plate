# Production: run the full backend on ONE machine with one public port (api-gateway).
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Frontend stays on Netlify; only expose the gateway (8080) via firewall / reverse proxy.

services:
  api-gateway:
    ports:
      - "8080:8080"

  # Do not publish microservice ports publicly — gateway is the only entry.
  config-server:
    ports: []
  discovery-server:
    ports: []
  auth-service:
    ports: []
  user-service:
    ports: []
  notification-service:
    ports: []
  payment-service:
    ports: []
  file-service:
    ports: []
  ai-service:
    ports: []
  audit-service:
    ports: []

  # Optional: disable local dev tooling in production
  frontend:
    profiles: ["dev-only"]
  mailhog:
    profiles: ["dev-only"]
  zipkin:
    profiles: ["dev-only"]
  prometheus:
    profiles: ["dev-only"]
  grafana:
    profiles: ["dev-only"]

  postgres:
    ports: []
  redis:
    ports: []
  kafka:
    ports: []
  minio:
    ports:
      - "9001:9001"

spring:
  datasource:
    driver-class-name: ${HIBERNATE_DRIVER_NAME:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:60000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:180000}
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:60000}
      connection-test-query: SELECT 1

  jackson:
    default-property-inclusion: non_null

  output:
    ansi:
      enabled: ${SPRING_OUTPUT_ANSI_ENABLED:ALWAYS}

  cache:
    type: redis
    redis:
      time-to-live: ${CACHE_DEFAULT_TTL:PT10M}
      cache-null-values: false
      use-key-prefix: true

  data:
    redis:
      url: ${REDIS_DATABASE_URL:redis://${REDIS_HOST:redis}:${REDIS_PORT:6379}/0}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
      ssl.endpoint.identification.algorithm: ${KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM:https}
      ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
      ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
      ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
      ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:JKS}

  jpa:
    show-sql: false
    generate-ddl: true
    properties:
      hibernate:
        ddl-auto: ${DATABASE_AUTO_DDL:create}
        format_sql: true
        use_sql_comments: true
        hbm2ddl:
          create_namespaces: true

management:
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true

platform:
  cache:
    enabled: ${CACHE_ENABLED:true}
    default-ttl: ${CACHE_DEFAULT_TTL:PT10M}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    register-with-eureka: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_CLIENT_FETCH_REGISTRY:true}
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    instance-id: ${spring.application.name}:${server.port}

logging:
  pattern:
    level: "%5p traceId=%X{traceId:-} spanId=%X{spanId:-} userId=%X{userId:-}"
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(${logging.pattern.level}) %clr([%15.15t]){faint} %clr(%-38.38logger{37}){cyan} %clr(:){faint} %m%n%wEx"
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

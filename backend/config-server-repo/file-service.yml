server:
  port: ${SERVER_PORT:${PORT:8085}}
spring:
  datasource:
    driver-class-name: ${HIBERNATE_DRIVER_NAME:org.postgresql.Driver}
    url: ${FILE_DATABASE_URL}
    username: ${FILE_DATABASE_USERNAME}
    password: ${FILE_DATABASE_PASSWORD}
  jpa:
    open-in-view: false
minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
file:
  public-base-url: ${FILE_PUBLIC_BASE_URL}
  download-base-url: ${FILE_DOWNLOAD_BASE_URL:${BACKEND_PUBLIC_URL:http://localhost:8080}}
